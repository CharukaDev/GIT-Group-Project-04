<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

<body>
    <header>
        <h1>📚 PageTurner Bookshop</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="catalog.html">Book Catalog</a> |
            <a href="reviews.html">Reviews</a> |
            <a href="about.html">About Us</a> |
            <a href="order.html">Place an Order</a>
        </nav>
        <hr>
    </header>
    <h2>Place an Order</h2>
    <p>Fill in the form below to order your books. We'll confirm your order by email.</p>
    <hr>
    <form action="#" method="post">
        <h3>1. Your Details</h3>
        <p>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" size="40" placeholder="e.g. Jane Smith" required>
        </p>
        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" size="40" placeholder="e.g. jane@example.com" required>
        </p>
        <p>
            <label for="phone">Phone Number (optional):</label><br>
            <input type="tel" id="phone" name="phone" size="40" placeholder="e.g. +94 77 123 4567">
        </p>
        <hr>
        <h3>2. Delivery Address</h3>

        <p>
            <label for="address">Street Address:</label><br>
            <input type="text" id="address" name="address" size="40" required>
        </p>

        <p>
            <label for="city">City:</label><br>
            <input type="text" id="city" name="city" size="30" required>
        </p>

        <p>
            <label for="postcode">Postal Code:</label><br>
            <input type="text" id="postcode" name="postcode" size="15">
        </p>

        <p>
            <label for="country">Country:</label><br>
            <select id="country" name="country">
                <option value="">-- Select Country --</option>
                <option value="lk">Sri Lanka</option>
                <option value="in">India</option>
                <option value="uk">United Kingdom</option>
                <option value="us">United States</option>
                <option value="au">Australia</option>
                <option value="other">Other</option>
            </select>
        </p>

        <hr>
